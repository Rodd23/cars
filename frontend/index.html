<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#010102" media="(prefers-color-scheme: dark)" />
    <title>Catálogo de veículos</title>
    <script>
      // Aplica a preferência de tema antes da primeira pintura (ver src/app/theme.ts).
      try {
        var t = localStorage.getItem("catalog-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
